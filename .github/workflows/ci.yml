name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test og byg
    runs-on: ubuntu-latest
    steps:
      # Hele historikken og alle tags, så versionen på siden kan beregnes (git describe).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer
        run: npm ci

      - name: Formatering
        run: npm run format:check || { echo "::error::Koden er ikke formateret. Kør 'npm run format' og commit resultatet."; exit 1; }

      - name: Tests
        run: npm test

      - name: Byg
        run: |
          npm run build
          test -f dist/.htaccess || { echo "::error::dist/.htaccess mangler (cache-regler til webserveren)."; exit 1; }

      # upload-artifact pakker selv mappen som en zip. Downloaden indeholder
      # index.html, .htaccess, manifest og icons/ direkte i roden – klar til at lægge på webserveren.
      - name: Gem dist som zip
        uses: actions/upload-artifact@v4
        with:
          name: colorsort-dist-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
          # Ellers kommer .htaccess (cache-regler til webserveren) ikke med.
          include-hidden-files: true
